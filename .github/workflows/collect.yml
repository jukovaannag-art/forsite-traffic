name: Сбор баллов пробок (Иркутск)

on:
  schedule:
    # Иркутск = UTC+8 круглый год. Окно сбора 7:00-23:00 по местному.
    #
    # Расписание тут - не «когда снимать балл», а «когда попытаться поднять
    # сборщик». Замерено 18-26.08.2026: GitHub исполняет ~16% тиков расписания
    # (8 запусков в сутки при 51 заявленном) и опаздывает на 5-60 минут.
    # Учащение тиков не помогает - переход с 1 раза в час на 3 дал +1 замер в
    # сутки. Поэтому один удавшийся запуск теперь держится в эфире до 5.5 часов
    # и снимает балл сам (см. шаг ниже), а тики нужны только чтобы поймать
    # момент, когда предыдущий прогон закончился.
    #
    # Часы UTC 20-23 (4:00-7:59 по Иркутску) - предутренние: вечерний прогон к
    # этому времени уже исчерпал бюджет, а собирать надо с 7:00. Именно сюда
    # нужен исполненный тик, поэтому предутренний интервал в расписании есть,
    # а глухая ночь (16-19 UTC = 0:00-3:59) выброшена: квота исполненных тиков
    # у GitHub общая на сутки, и тик, потраченный в 2 часа ночи, отнимается у
    # утра.
    - cron: "*/20 20-23,0-15 * * *"
  workflow_dispatch: # кнопка "Run workflow" для ручного прогона

permissions:
  contents: write

concurrency:
  # Второй прогон не стартует параллельно, а встаёт в очередь и подхватывает
  # эстафету, когда у текущего кончится бюджет. Так окно закрывается без дыры.
  group: collect-traffic
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # Потолок задания у GitHub - 6 часов; берём с запасом на checkout и пуши.
    timeout-minutes: 355
    env:
      # Шаг опроса. Внутри часа засчитывается первый удачный замер (upsert по
      # дата+час+источник), остальные пять - бесплатные ретраи: файл не
      # меняется, коммита нет.
      STEP_MINUTES: 10
      LOOP_MINUTES: 330
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Зависимостей у сборщика нет - только стандартная библиотека.
      - name: Снимать балл, пока открыто окно 7:00-23:00
        run: |
          set -uo pipefail
          git config user.name "traffic-bot"
          git config user.email "traffic-bot@users.noreply.github.com"

          step=$(( STEP_MINUTES * 60 ))
          deadline=$(( $(date +%s) + LOOP_MINUTES * 60 ))

          push_with_retry() {
            # Соседний прогон (или ручной коммит) мог опередить - подтягиваем и
            # пробуем ещё раз. Не вышло - строка уже в локальном коммите,
            # уедет со следующим пушем, цикл из-за этого не рвём.
            for attempt in 1 2 3; do
              git pull --rebase --autostash -q && git push -q && return 0
              echo "Пуш не прошёл (попытка $attempt), ждём."
              sleep 20
            done
            echo "::warning::Не удалось запушить, строки останутся до следующего раза."
            return 1
          }

          # Иркутск = UTC+8 без перевода часов, поэтому час считаем сдвигом от
          # UTC, а не через TZ=Asia/Irkutsk: если на образе не окажется базы
          # часовых поясов, TZ молча вернёт UTC и окно съедет на восемь часов.
          irk() { date -u -d '+8 hours' "$@"; }

          while true; do
            hour=$(irk '+%-H')
            if [ "$hour" -ge 7 ]; then
              python collect.py || echo "::warning::Ни один источник не ответил."
              # --porcelain, а не git diff: файл может быть ещё не отслеживаемым.
              if [ -n "$(git status --porcelain -- data/traffic_irkutsk.csv)" ]; then
                git add data/traffic_irkutsk.csv
                git commit -q -m "Пробки Иркутск: $(irk '+%Y-%m-%d %H:00')"
                push_with_retry
              else
                echo "Час $hour:00 уже закрыт, новых строк нет."
              fi
            else
              # Ночью не опрашиваем, но и не выходим: старт до 7:00 - это уже
              # выигранный билет, и разбрасываться им нельзя. Прогон досыпает
              # до открытия окна и начинает собирать ровно в 7:00. Раньше здесь
              # был выход, и утро 27.08.2026 оказалось потеряно: ночью цикл
              # вышел, а исполненного тика до 7:00 не случилось.
              echo "Ночь ($hour:00) - спим до 7:00."
            fi

            now=$(date +%s)
            # Границы кратны шагу от эпохи, поэтому замеры ложатся на :00, :10,
            # :20... - первый в часе приходится на начало часа, а не на середину.
            next=$(( (now / step + 1) * step ))
            if [ "$next" -gt "$deadline" ]; then
              echo "Бюджет прогона исчерпан, эстафету примет следующий запуск."
              break
            fi
            sleep $(( next - now ))
          done
